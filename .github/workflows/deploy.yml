# 자동 배포: main에 push(PR 머지)되면 테스트 → EC2 배포 → 배포된 커밋 확인.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         EC2 주소 (예: 3.107.144.61)
#   DEPLOY_USER         SSH 사용자 (예: ubuntu)
#   DEPLOY_SSH_KEY      배포 전용 개인 키 (서버 authorized_keys에서 server_update.sh만 실행하도록 묶어 둔 키)
#   DEPLOY_KNOWN_HOSTS  서버 호스트 키 (ssh-keyscan 결과) — 중간자 접속 방지
# 서버 쪽은 키에 command= 제한이 걸려 있어서, 이 워크플로가 어떤 명령을 보내도 아래만 실행된다:
#   cd ~/tactilecheck && git pull --ff-only && bash scripts/server_update.sh
# (먼저 pull 하는 이유: 배포 스크립트 자체가 바뀐 커밋이면 새 스크립트로 돌리기 위해)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Actions 탭에서 수동 재배포

permissions:
  contents: read

# 배포가 겹치지 않게 한 번에 하나씩 (진행 중인 배포는 끊지 않고 다음 것을 기다리게 함)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEALTH_URL: https://3-107-144-61.sslip.io/api/health
    steps:
      - name: SSH 키 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: EC2 배포 (server_update.sh)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST"

      - name: 배포된 커밋 확인
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 20); do
            got=$(curl -sf --max-time 10 "$HEALTH_URL" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit",""))' || true)
            echo "서버 커밋: ${got:-응답 없음} / 이번 커밋: $want"
            if [ "$got" = "$want" ]; then echo "배포 확인 완료"; exit 0; fi
            sleep 6
          done
          echo "::error::서버 커밋($got)이 이번 커밋($want)과 다릅니다. 바로 뒤에 다른 커밋이 머지됐다면 그 배포가 이어서 확인합니다."
          exit 1

      - name: SSH 키 삭제
        if: always()
        run: rm -f ~/.ssh/deploy_key
