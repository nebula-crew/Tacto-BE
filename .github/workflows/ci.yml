# PR 테스트: main으로 가는 PR마다 백엔드 테스트를 돌린다. 배포는 하지 않는다 (배포는 deploy.yml).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 테스트는 실제 Supabase·관리자 토큰을 절대 쓰지 않는다 (tests/conftest.py도 한 번 더 막음)
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      ADMIN_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # Dockerfile과 같은 버전
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt
            requirements-dev.txt
      - name: 의존성 설치 (CPU 전용 PyTorch 먼저)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt -r requirements-dev.txt
      - name: 테스트
        run: python -m pytest -q
